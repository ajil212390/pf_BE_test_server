name: Build and Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build backend
      run: docker build -t myapp/backend:latest ./ProductCatalogApi
      
    - name: Build frontend
      run: docker build -t myapp/frontend:latest ./frontend

    # Add steps here to login to your container registry and push the images
    # e.g., using docker/login-action and docker/build-push-action
