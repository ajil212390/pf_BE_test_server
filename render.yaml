services:
  - type: web
    name: product-catalog-api
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn catalog_project.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: catalog-db
          property: connectionString

databases:
  - name: catalog-db
    databaseName: mydb
    user: postgres
